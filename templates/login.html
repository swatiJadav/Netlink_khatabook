<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Netlink KhataBook</title>

    <style>
        body{
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            font-family:'Segoe UI',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        .card{
            background:#fff;
            width:380px;
            padding:32px;
            border-radius:20px;
            box-shadow:0 25px 50px rgba(0,0,0,0.18);
        }
        .logo{
            text-align:center;
            font-size:22px;
            font-weight:700;
            margin-bottom:6px;
        }
        .subtitle{
            text-align:center;
            font-size:13px;
            color:#777;
            margin-bottom:26px;
        }
        input{
            width:100%;
            padding:13px;
            border-radius:12px;
            border:1px solid #ddd;
            margin-bottom:14px;
            font-size:14px;
            outline:none;
        }
        input:focus{
            border-color:#4facfe;
        }
        .forgot{
            text-align:right;
            margin-top:-6px;
            margin-bottom:14px;
        }
        .forgot a{
            font-size:13px;
            color:#3498db;
            text-decoration:none;
            font-weight:600;
        }
        .forgot a:hover{
            text-decoration:underline;
        }
        button{
            width:100%;
            background:#4facfe;
            color:#fff;
            padding:13px;
            border:none;
            border-radius:14px;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            margin-top:4px;
        }
        button:hover{
            background:#2f8dfd;
        }
        .link{
            text-align:center;
            margin-top:20px;
            font-size:13px;
        }
        .link a{
            color:#4facfe;
            text-decoration:none;
            font-weight:600;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="logo">📘 Netlink KhataBook</div>
    <div class="subtitle">Login to manage your business</div>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <!-- FORGOT PASSWORD -->
        <div class="forgot">
            <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="link">
        New here? <a href="{{ url_for('register') }}">Create account</a>
    </div>
</div>

</body>
</html>
