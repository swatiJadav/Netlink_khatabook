<!DOCTYPE html>
<html>
<head>
    <title>Set New Password</title>
    <style>
        body{
            background:linear-gradient(135deg,#43cea2,#185a9d);
            font-family:'Segoe UI',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .card{
            background:#fff;
            width:380px;
            padding:30px;
            border-radius:18px;
            box-shadow:0 20px 40px rgba(0,0,0,0.2);
        }
        h2{
            text-align:center;
            margin-bottom:10px;
        }
        p{
            text-align:center;
            font-size:13px;
            color:#666;
        }
        input{
            width:100%;
            padding:12px;
            margin-top:14px;
            border-radius:10px;
            border:1px solid #ddd;
        }
        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            background:#43cea2;
            border:none;
            color:#fff;
            font-size:15px;
            font-weight:600;
            border-radius:12px;
            cursor:pointer;
        }
        button:hover{
            background:#2bb48a;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Set New Password</h2>
    <p>User: <b>{{ username }}</b></p>

    <form method="POST">
        <input type="password" name="password" placeholder="Enter new password" required>
        <button type="submit">Update Password</button>
    </form>
</div>

</body>
</html>
