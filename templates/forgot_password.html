<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Netlink KhataBook</title>

    <style>
        body{
            background:linear-gradient(135deg,#667eea,#764ba2);
            font-family:'Segoe UI', sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }
        .card{
            background:#ffffff;
            width:380px;
            padding:32px;
            border-radius:20px;
            box-shadow:0 22px 45px rgba(0,0,0,0.18);
        }
        .logo{
            text-align:center;
            font-size:22px;
            font-weight:700;
            margin-bottom:6px;
        }
        .subtitle{
            text-align:center;
            font-size:13px;
            color:#777;
            margin-bottom:20px;
        }
        .info{
            font-size:13px;
            color:#555;
            background:#f5f6fa;
            padding:12px;
            border-radius:12px;
            margin-bottom:18px;
            text-align:center;
        }
        input{
            width:100%;
            padding:12px;
            border-radius:10px;
            border:1px solid #ddd;
            margin-bottom:14px;
            font-size:14px;
        }
        button{
            width:100%;
            background:#667eea;
            color:#fff;
            padding:12px;
            border:none;
            border-radius:12px;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
        }
        button:hover{
            background:#5563d9;
        }
        .links{
            text-align:center;
            margin-top:16px;
            font-size:13px;
        }
        .links a{
            color:#667eea;
            text-decoration:none;
            font-weight:600;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">🔐 Reset Password</div>
    <div class="subtitle">Netlink KhataBook</div>

    <div class="info">
        Enter your username and set a new password.
    </div>

    <!-- ✅ FINAL WORKING FORM -->
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="new_password" placeholder="New Password" required>

        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <button type="submit">Set New Password</button>
    </form>

    <div class="links">
        <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>
</div>

</body>
</html>
